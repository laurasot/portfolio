<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animatic v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #fff; --tinta: #1C1B19; --suave: #8C8982; --linea: #E4E1DB;
    --cam: 1600ms; --pose: 800ms; --fade: 600ms;
    --ease: cubic-bezier(.45,.05,.25,1);
  }
  @media (prefers-reduced-motion: reduce) { :root { --cam: 0ms; --pose: 0ms; --fade: 0ms; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--tinta); }

  /* 1440×900 design space, scaled to fit the window */
  #stage { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 0 0; background: var(--fondo); overflow: hidden; }
  .abs { position: absolute; }

  .floor { position: absolute; height: 1px; background: var(--linea); opacity: .7;
    transition: top var(--cam) var(--ease), left var(--cam) var(--ease), width var(--cam) var(--ease); }

  #cam { position: absolute; inset: 0; transform-origin: 1040px 340px; transition: transform var(--cam) var(--ease); }
  #light { left: 800px; top: 280px; width: 700px; height: 700px; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(255,230,191,.55), rgba(255,230,191,0)); transition: opacity 1500ms ease; }
  #statue { left: 1040px; top: 340px; width: 220px; height: 530px; }
  #poseWrap { position: absolute; inset: 0; transform-origin: 50% 100%; transition: transform var(--pose) var(--ease); }
  #poseWrap.turn { animation: squash 2000ms var(--ease); }
  @keyframes squash { 50% { transform: scaleX(.94); } }
  .breathe { position: absolute; inset: 0; transform-origin: 50% 100%; animation: breathe 6s ease-in-out infinite alternate; }
  @keyframes breathe { to { transform: scale(1.004); } }
  @media (prefers-reduced-motion: reduce) { .breathe, #poseWrap.turn { animation: none; } }
  .pose { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0;
    background-repeat: no-repeat; background-size: 1536px 1024px; background-position: -990px -380px;
    /* shortcut: the generated images' background is off-white; push it to white and fade the crop edges. Real cutouts (transparent PNG) replace this in Phase 1. */
    filter: brightness(1.07) contrast(1.05);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent), linear-gradient(180deg, transparent, #000 4%, #000 94%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect;
    transition: opacity var(--pose) ease; }
  .pose.on { opacity: 1; }
  .pose.slow { transition-duration: 2000ms; }

  #placa { left: 1016px; top: 840px; transform: translate(-100%, -100%); background: var(--fondo); border: 1px solid var(--linea); padding: 8px 12px; }
  #placa b { display: block; font-weight: 400; font-size: 13px; line-height: 1.5; }
  #postit { left: 1080px; top: 720px; width: 116px; height: 96px; padding: 12px; transform: rotate(-4deg);
    background: #FFF6D1; box-shadow: 0 2px 6px rgba(0,0,0,.08);
    font: italic 400 17px/1.1 "Cormorant Garamond", serif; display: none; }

  .meta { font: 500 11px/1.4 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--suave); }
  #exit { right: 160px; top: 72px; opacity: 0; transition: opacity var(--fade) ease; }
  #sospecha { left: 160px; top: 72px; width: 300px; opacity: 0; transition: opacity 1200ms ease; }
  #sospecha .t { font-size: 13px; line-height: 1.5; color: var(--tinta); margin: 4px 0; }

  #text { left: 160px; top: 330px; width: 720px; transition: top var(--fade) ease; }
  .line { font: 300 44px/1.25 "Cormorant Garamond", serif; letter-spacing: -.01em; margin: 0 0 16px;
    opacity: 0; transform: translateY(6px); transition: opacity var(--fade) ease, transform var(--fade) ease; }
  .line.in { opacity: 1; transform: none; }
  .line.dim { opacity: .35; }
  .opts { display: flex; gap: 56px; padding-top: 28px; opacity: 0; transition: opacity var(--fade) ease; }
  .opts.in { opacity: 1; }
  .opt { font: 400 30px/1.2 "Cormorant Garamond", serif; background: none; border: 0; padding: 0 0 6px; color: var(--tinta);
    cursor: pointer; border-bottom: 1px solid transparent; transition: opacity 400ms ease, border-color 200ms; }
  .opt:hover, .opt:focus-visible { border-bottom-color: var(--suave); outline: none; }
  .opts.chosen .opt { opacity: .25; } .opts.chosen .opt.pick { opacity: 1; border-bottom-color: var(--suave); }
  .block { padding-top: 24px; display: grid; gap: 28px; opacity: 0; transition: opacity var(--fade) ease; }
  .block.in { opacity: 1; }
  .item { border-left: 1px solid var(--linea); padding-left: 20px; }
  .item .ti { font: 400 30px/1.2 "Cormorant Garamond", serif; margin-top: 6px; }
  .item .bo { font-size: 15px; line-height: 1.6; color: var(--suave); max-width: 560px; margin-top: 6px; }
  #exits { left: 160px; top: 800px; display: flex; gap: 32px; opacity: 0; transition: opacity 1200ms ease; }
  #exits span { color: var(--tinta); }

  #gate { position: absolute; inset: 0; background: var(--fondo); display: flex; align-items: center; padding-left: 160px; gap: 40px; z-index: 5;
    transition: opacity 600ms ease; }
  #gate p { font: 300 44px/1.25 "Cormorant Garamond", serif; margin: 0; }
  #gate.out { opacity: 0; pointer-events: none; }

  /* animatic controls (not part of the design) */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    font: 12px/1.4 Inter, sans-serif; color: #6f6c66; background: rgba(255,255,255,.92); border-top: 1px solid #eee; z-index: 10; }
  #bar button { font: inherit; background: none; border: 1px solid #ddd; border-radius: 4px; padding: 3px 9px; cursor: pointer; color: inherit; }
  #bar .lbl { color: #1C1B19; font-weight: 500; }
  #bar .note { flex-basis: 100%; color: #8C8982; }
  #bar.hide .note { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="floor" id="floorL"></div><div class="floor" id="floorR"></div>
  <div id="cam">
    <div class="abs" id="light"></div>
    <div class="abs" id="statue"><div id="poseWrap"><div class="breathe" id="poses"></div></div></div>
    <div class="abs" id="placa"><b id="placaT"></b><span class="meta" id="placaD"></span></div>
    <div class="abs" id="postit"></div>
  </div>
  <div class="abs meta" id="exit">Ir directo a proyectos →</div>
  <div class="abs" id="sospecha"><div class="meta" id="sE"></div><div class="t" id="sT"></div><div class="meta">Puedo estar equivocada.</div></div>
  <div class="abs" id="text" aria-live="polite"></div>
  <div class="abs meta" id="exits"><span>Proyectos</span><span>Contacto</span><span>GitHub</span></div>
  <div id="gate"><p>¿Con sonido?</p><button class="opt" data-s="1">Sí</button><button class="opt" data-s="0">No</button></div>
</div>

<div id="bar">
  <button id="prev" title="←">◀</button><button id="play" title="espacio">❚❚</button><button id="next" title="→">▶</button>
  <span class="lbl" id="lbl">—</span>
  <button id="speed">1×</button><button id="notes">notas</button><button id="restart">reiniciar</button>
  <span class="note" id="note"></span>
</div>

<script>
// Pose images live next to this file (portfolio/v2). All share the same framing, so one crop fits all.
const POSES = {
  base: "Imagen de ChatGPT 1 nov 2026, 02_52_45.png",
  pensando: "Escultura pensativa sobre pedestal blanco.png",
  cinta: "Estatua minimalista con cinta reparadora.png",
  duda: "Estatua de piedra en gesto de duda.png",
  "mira-cinta": "Figura de mármol con cinta en el hombro.png",
  giro: "Estatua minimalista con bandage en pedestal.png",
};
// The plaque only appears once, at the very end, with her name.
const P0=null, P1=null, P2=null, P3=null, P4=null, P5=null, P6=null, P7=["Laura Soto",""];
const S1=["Sospecha #1","Te gusta entender cómo funcionan las cosas."], S2=["Sospecha #2","No te convence mucho el marketing."];

// hold = ms the step stays before auto-advancing (counted after camera + lines finish)
const STEPS = [
  {id:"01",t:"Pantalla blanca",k:1,pose:"base",placa:P0,hold:1000,note:"Quieta. La placa ya está ahí. Sin loader."},
  {id:"02",t:"Respira",k:1,pose:"base",placa:P0,exit:1,hold:500,note:"Aparece la salida rápida."},
  {id:"03",t:"…",k:1,pose:"base",placa:P0,exit:1,lines:["…"],hold:2000,note:"\"…\" dura 2 s."},
  {id:"04",t:"Ah. Llegaste.",k:1,pose:"base",rot:-1,placa:P0,exit:1,lines:["Ah. Llegaste."],hold:2200,note:"Cabeza hacia ti."},
  {id:"05",t:"Sin 'Sobre mí'",k:1.15,pose:"base",placa:P1,exit:1,lines:["Laura me pidió que no hiciera una sección \"Sobre mí\".","Así que aquí estoy."],dim:1,hold:2200,note:"Cámara: un paso más cerca (1.6 s). Después aparece el texto."},
  {id:"06",t:"Flojera",k:1.15,pose:"base",flip:1,placa:P1,exit:1,lines:["Dice que una decisión explica más que una descripción.","Yo creo que le da flojera escribir su biografía."],dim:1,hold:2400,note:"Mira hacia otro lado (espejada)."},
  {id:"07",t:"¿Por cuál empiezo?",k:1.15,pose:"base",placa:P1,exit:1,lines:["Tengo como diez cosas que mostrarte.","¿Por cuál empiezo?"],dim:1,hold:1500,note:"Vuelve al frente."},
  {id:"08",t:"Primera pregunta",k:1.15,pose:"pensando",placa:P1,exit:1,postit:"no hay respuesta incorrecta",lines:["¿Qué te importa más cuando conoces a alguien?"],options:["Ideas","Resultados","Honestidad","Elegancia"],choose:"Ideas",hold:1200,note:"Pose: pensando. Post-it. En el animatic se elige sola a los 3 s (o haz clic)."},
  {id:"09",t:"Respuesta: Ideas",k:1.15,pose:"base",placa:P2,exit:1,light:1,sospecha:S1,lines:["Bien. Me salto la parte donde intento impresionarte."],hold:2500,note:"Se va el post-it (corte). Luz tibia. Sospecha #1."},
  {id:"10",t:"Segunda pregunta",k:1.15,pose:"pensando",placa:P2,exit:1,sospecha:S1,lines:["Otra. ¿Qué admiras más?"],options:["Ideas","Éxito","Dinero","Reconocimiento"],choose:"Dinero",hold:1200,note:"Pose: pensando."},
  {id:"11",t:"Respuesta honesta",k:1.15,pose:"base",rot:-1,placa:P3,exit:1,sospecha:S2,lines:["Respuesta honesta.","Casi nadie elige esa. Bueno, casi nadie lo admite."],dim:1,hold:2500,note:"Cabeza hacia ti. Sospecha #2."},
  {id:"12",t:"Casi no funcionó",k:1.15,pose:"pensando",placa:P4,exit:1,sospecha:S2,top:220,lines:["Este casi no funcionó. Por eso es de mis favoritos."],block:[["Experimento 01","[Nombre del experimento]","[Qué intentó, qué salió mal, qué rescató.]"]],hold:3000,note:"Modo Ideas: empieza por un experimento."},
  {id:"13",t:"Gusto propio",k:1.15,pose:"base",rot:-2,placa:P4,exit:1,postit:"favorito ★",top:220,lines:["Ese también me gusta.","Los otros tienen más estrellas en GitHub, pero bueno."],dim:1,block:[["Proyecto","[Proyecto exitoso A]"],["Proyecto","[Proyecto exitoso B]"],["Proyecto · el que abriste","[Proyecto pequeño / experimental]"]],hold:3000,note:"Gira 2° hacia el proyecto. Post-it: favorito."},
  {id:"14",t:"No salió como esperaba",k:1.15,pose:"mira-cinta",placa:P5,exit:1,top:220,lines:["Esto no salió como esperaba.","Pero salió algo."],dim:1,block:[["Cosa rara 01","[Qué pasó]"],["Cosa rara 02","[Qué pasó]"]],hold:3000,note:"Aparece la cinta: mira su propio arreglo. Desde aquí se queda."},
  {id:"15",t:"Se pone interesante",k:1.15,pose:"duda",placa:P5,exit:1,postit:"no tocar, se cae",top:220,lines:["Aquí es donde se pone interesante."],block:[["Cosa rara 02 · abierta","[Lo que salió raro]","[Qué hizo después.]"]],hold:3000,note:"Pose: duda (\"ni idea\")."},
  {id:"16",t:"Ya sé",k:1,pose:"cinta",placa:P6,exit:1,lines:["Creo que ya sé qué viniste a buscar."],hold:2200,note:"Cámara: vuelve atrás (1.6 s)."},
  {id:"17",t:"¿Quién es Laura?",k:1.02,pose:"cinta",placa:P6,exit:1,lines:["¿Quieres saber quién es Laura?"],hold:2000,note:"2 s de silencio."},
  {id:"18",t:"El giro",k:1.04,pose:"giro",placa:P6,exit:1,hold:2600,note:"GIRA hacia ti. Única vez. Fundido de 2 s."},
  {id:"19",t:"El resto en GitHub",k:1.04,pose:"giro",placa:P7,exit:1,lines:["Eso es lo que sé de ella.","El resto está en su GitHub."],dim:1,exits:1,hold:0,note:"Placa con su nombre. Salidas abajo."},
];

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let speed = 1, playing = true, cur = -1, timers = [], lastK = 1, sound = false, actx = null;
const T = ms => reduce ? 0 : ms / speed;

// stage fit
function fit() { const s = Math.min(innerWidth / 1440, (innerHeight - 64) / 900); $("stage").style.transform = `translate(-50%, calc(-50% - 28px)) scale(${s})`; $("stage").style.transformOrigin = "50% 50%"; }
addEventListener("resize", fit); fit();

// pose layers
for (const [k, f] of Object.entries(POSES)) { const d = document.createElement("div"); d.className = "pose"; d.dataset.p = k; d.style.backgroundImage = `url("${encodeURI(f)}")`; $("poses").appendChild(d); }

// soft piano-ish note (WebAudio), only if the visitor said yes
function note(f) {
  if (!sound) return;
  actx = actx || new AudioContext();
  const t = actx.currentTime, g = actx.createGain(), lp = actx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 2200; g.connect(lp).connect(actx.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + 2.2);
  for (const [m, type, v] of [[1, "triangle", 1], [2, "sine", .35], [3, "sine", .12]]) {
    const o = actx.createOscillator(), og = actx.createGain(); o.type = type; o.frequency.value = f * m; og.gain.value = v;
    o.connect(og).connect(g); o.start(t); o.stop(t + 2.3);
  }
}
const NOTES = { Ideas: 392, Resultados: 440, Honestidad: 523.25, Elegancia: 587.33, "Éxito": 440, Dinero: 523.25, Reconocimiento: 587.33 };

function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clear() { timers.forEach(clearTimeout); timers = []; }

function camera(k) {
  $("cam").style.transform = `translate(${-(k - 1) * 180}px, ${-(k - 1) * 430}px) scale(${k})`;
  const sx = 1040 - (k - 1) * 180, y = 780 + (k - 1) * 40;
  Object.assign($("floorL").style, { left: "0px", width: sx + 30 * k + "px", top: y + "px" });
  Object.assign($("floorR").style, { left: sx + 122 * k + "px", width: 1440 - (sx + 122 * k) + "px", top: y + "px" });
}

function show(i) {
  clear(); cur = Math.max(0, Math.min(STEPS.length - 1, i)); const s = STEPS[cur];
  $("lbl").textContent = `${s.id} · ${s.t}`; $("note").textContent = s.note || "";

  // 1) camera first; text waits for it
  const camMoves = s.k !== lastK; camera(s.k); lastK = s.k;
  const wait = camMoves ? T(1600) : 0;

  // 2) statue: pose crossfade, flip/rotation, the one-time turn
  const turning = s.pose === "giro" && !document.querySelector('.pose.on[data-p="giro"]');
  document.querySelectorAll(".pose").forEach(p => { p.classList.toggle("on", p.dataset.p === s.pose); p.classList.toggle("slow", turning); });
  $("poseWrap").classList.remove("turn"); if (turning) { void $("poseWrap").offsetWidth; $("poseWrap").classList.add("turn"); }
  $("poseWrap").style.transform = s.flip ? "scaleX(-1)" : `rotate(${s.rot || 0}deg)`;

  // 3) hard cuts: plaque and post-it change instantly
  $("placa").style.display = s.placa ? "" : "none";
  if (s.placa) { $("placaT").textContent = s.placa[0]; $("placaD").textContent = s.placa[1]; $("placaD").hidden = !s.placa[1]; }
  $("postit").style.display = s.postit ? "block" : "none"; $("postit").textContent = s.postit || "";
  $("light").style.opacity = s.light ? 1 : 0;
  $("exit").style.opacity = s.exit ? 1 : 0;
  $("exits").style.opacity = s.exits ? 1 : 0;
  if (s.sospecha) { $("sE").textContent = s.sospecha[0]; $("sT").textContent = s.sospecha[1]; }
  $("sospecha").style.opacity = s.sospecha ? 1 : 0;

  // 4) text: lines one at a time (1.2 s apart), then options / content
  const box = $("text"); box.innerHTML = ""; box.style.top = (s.top || 330) + "px";
  let at = wait;
  const lines = (s.lines || []).map(txt => { const p = document.createElement("p"); p.className = "line"; p.textContent = txt; box.appendChild(p); return p; });
  lines.forEach((p, j) => { later(() => { if (s.dim && j > 0) lines[j - 1].classList.add("dim"); p.classList.add("in"); }, at); at += j < lines.length - 1 ? T(1200) : T(600); });
  if (s.options) {
    const o = document.createElement("div"); o.className = "opts";
    s.options.forEach(w => { const b = document.createElement("button"); b.className = "opt"; b.textContent = w; b.onclick = () => choose(o, b, w); o.appendChild(b); });
    box.appendChild(o); later(() => o.classList.add("in"), at); at += T(600);
    later(() => { if (!o.classList.contains("chosen")) choose(o, [...o.children].find(b => b.textContent === s.choose), s.choose); }, at + T(3000));
    return; // the choice advances the step
  }
  if (s.block) {
    const b = document.createElement("div"); b.className = "block";
    for (const [m, ti, bo] of s.block) b.insertAdjacentHTML("beforeend", `<div class="item"><div class="meta">${m}</div><div class="ti">${ti}</div>${bo ? `<div class="bo">${bo}</div>` : ""}</div>`);
    box.appendChild(b); later(() => b.classList.add("in"), at); at += T(600);
  }
  if (playing && cur < STEPS.length - 1) later(() => show(cur + 1), at + T(s.hold));
}

function choose(o, btn, w) {
  if (o.classList.contains("chosen")) return;
  o.classList.add("chosen"); btn.classList.add("pick"); note(NOTES[w] || 440);
  if (playing) later(() => show(cur + 1), T(1200));
}

// controls
$("gate").querySelectorAll("button").forEach(b => b.onclick = () => { sound = b.dataset.s === "1"; if (sound) note(392); $("gate").classList.add("out"); later(() => show(0), T(600)); });
$("next").onclick = () => show(cur + 1);
$("prev").onclick = () => show(cur - 1);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚" : "▶︎ play"; if (playing) show(cur); else clear(); };
$("speed").onclick = () => { speed = speed === 1 ? 0.5 : speed === 0.5 ? 2 : 1; $("speed").textContent = speed + "×"; };
$("notes").onclick = () => $("bar").classList.toggle("hide");
$("restart").onclick = () => { clear(); lastK = 1; camera(1); $("gate").classList.remove("out"); cur = -1; $("text").innerHTML = ""; };
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); $("play").click(); }
});
camera(1);
document.querySelector('.pose[data-p="base"]').classList.add("on");
$("placa").style.display = "none";
</script>
</body>
</html>
